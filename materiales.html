<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Delivery Rush | Materiales</title>
        <link rel="stylesheet" href="css/materiales.css" />
    </head>
    <body class="materials-game-page">
        <canvas id="gameCanvas" aria-label="Area de juego Delivery Rush"></canvas>
        <div id="hud" class="game-hud" aria-live="polite"></div>
        <div class="game-legend">
            <span><i class="legend-supply"></i>Abasto</span><span><i class="legend-player"></i>Jugador</span
            ><span><i class="legend-urgent"></i>Entrega urgente</span>
        </div>
        <div id="menu" class="game-menu">
            <span class="eyebrow">Juego de materiales</span>
            <h1>Delivery Rush</h1>
            <p>Recoge material en abasto y entrégalo a las zonas que cambian a amarillo.</p>
            <div class="control-hints"><span>WASD</span><span>Flechas</span></div>
            <button id="startGameBtn" type="button">Iniciar juego</button>
        </div>
        <div id="gameOver" class="game-menu" hidden>
            <span class="eyebrow">Turno terminado</span>
            <h2>Resultado</h2>
            <strong id="finalScore">0 puntos</strong><button id="restartGameBtn" type="button">Jugar de nuevo</button>
        </div>
        <script src="js/materiales.js"></script>
    </body>
</html>
